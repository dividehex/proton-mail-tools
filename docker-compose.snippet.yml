# Paste these two services into your stack's compose file (and `proton-bridge-data:`
# under its top-level `volumes:`); add the PROTON_* variables to the stack's .env.
# Assumes this repository is checked out at ./proton-mail-tools next to that file.
#
# Proton Mail Bridge runs headless in its own container and owns the network
# namespace; the tool service joins it, so Bridge's IMAP/SMTP ports are only
# reachable over the shared loopback. OpenWebUI reaches the tools by name at
# http://proton-mail-tools:8930 over a shared Docker network. No host ports.
#
# Replace `ai-agent` below with the network your OpenWebUI container is attached to.
#
# First login (never while proton-bridge is running):
#   docker compose stop proton-mail-tools proton-bridge
#   docker compose run --rm -it proton-bridge init      # `login`, then `info` for the Bridge password
#   docker compose up -d proton-bridge proton-mail-tools
services:
  proton-bridge:
    build:
      context: ./proton-mail-tools/bridge
    image: proton-bridge:3.26.0
    container_name: ai-proton-bridge
    restart: unless-stopped
    # PROTON_BRIDGE_HOME defaults to /root. Set it to the desktop user's home
    # (e.g. /home/alice) only when migrating an existing desktop Bridge: the vault
    # stores absolute paths, so the volume must be mounted where they resolve.
    environment:
      HOME: ${PROTON_BRIDGE_HOME:-/root}
    volumes:
      - proton-bridge-data:${PROTON_BRIDGE_HOME:-/root}
    networks:
      ai-agent:
        aliases:
          - proton-mail-tools

  proton-mail-tools:
    build:
      context: ./proton-mail-tools
    container_name: ai-proton-mail-tools
    restart: unless-stopped
    network_mode: "service:proton-bridge"
    depends_on:
      - proton-bridge

    environment:
      LISTEN_ADDR: ":8930"
      API_KEY: ${PROTON_TOOLS_API_KEY}

      BRIDGE_IMAP_ADDR: 127.0.0.1:1143
      BRIDGE_SMTP_ADDR: 127.0.0.1:1025
      BRIDGE_USERNAME: ${PROTON_BRIDGE_USERNAME}
      BRIDGE_PASSWORD: ${PROTON_BRIDGE_PASSWORD}
      # Bridge presents a self-signed certificate on loopback.
      BRIDGE_TLS_SKIP_VERIFY: "true"

      MAIL_FROM_ADDRESS: ${PROTON_MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${PROTON_MAIL_FROM_NAME:-}

      ALLOW_SEND: ${PROTON_TOOLS_ALLOW_SEND:-true}
      ALLOW_DELETE: ${PROTON_TOOLS_ALLOW_DELETE:-true}
      # Permanent deletion (delete_messages / empty_mailbox in Spam and Trash). Off by default.
      ALLOW_PURGE: ${PROTON_TOOLS_ALLOW_PURGE:-false}

      MAX_BODY_CHARS: "20000"
      SEARCH_DEFAULT_LIMIT: "20"
      SEARCH_MAX_LIMIT: "100"

volumes:
  proton-bridge-data:
